<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vocht Monitor</title>
  <style>
    body { font-family: Arial, sans-serif; max-width: 500px; margin: 20px auto; padding: 15px; background: #f4f7f6; }
    .card { background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); }
    h2 { text-align: center; color: #333; margin-top: 0; }
    .user-tag { text-align: center; font-size: 0.9em; color: #666; margin-bottom: 10px; }
    .progress-container { background: #e0e0e0; border-radius: 20px; height: 30px; width: 100%; overflow: hidden; margin: 15px 0; }
    .progress-bar { height: 100%; width: 0%; background: #4caf50; transition: width 0.4s, background-color 0.4s; }
    .status-text { text-align: center; font-size: 1.2em; font-weight: bold; margin-bottom: 15px; }
    .form-group { margin-bottom: 15px; }
    label { display: block; margin-bottom: 5px; font-weight: bold; }
    input, select { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box; font-size: 1em; }
    .quick-buttons { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 15px; }
    .quick-buttons button { flex: 1; min-width: 80px; padding: 10px; background: #e0f2fe; border: 1px solid #0284c7; color: #0369a1; border-radius: 6px; font-weight: bold; cursor: pointer; }
    .btn-submit { width: 100%; padding: 12px; background: #0284c7; color: white; border: none; border-radius: 6px; font-size: 1.1em; font-weight: bold; cursor: pointer; }
    .history { margin-top: 25px; }
    .history ul { list-style: none; padding: 0; }
    .history li { padding: 8px 12px; border-bottom: 1px solid #eee; display: flex; justify-content: space-between; }
    .loading { text-align: center; color: #888; margin: 10px 0; }
  </style>
</head>
<body>

<div class="card">
  <h2>Vocht Monitor</h2>
  <div id="user-info" class="user-tag">Laden...</div>

  <div class="status-text">
    <span id="total-amount">0</span> / <span id="limit-amount">1000</span> ml
  </div>

  <div class="progress-container">
    <div id="progress-bar" class="progress-bar"></div>
  </div>

  <form id="drink-form">
    <div class="form-group">
      <label>Sneltoevoeging (ml):</label>
      <div id="quick-buttons-container" class="quick-buttons">
        <!-- Wordt dynamisch opgeladen vanuit Sheet -->
      </div>
    </div>

    <div class="form-group">
      <label for="amount">Hoeveelheid (ml):</label>
      <input type="number" id="amount" min="1" placeholder="Bijv. 150" required>
    </div>

    <div class="form-group">
      <label for="type">Type drank:</label>
      <select id="type">
        <!-- Wordt dynamisch opgeladen vanuit Sheet -->
      </select>
    </div>

    <div class="form-group">
      <label for="note">Opmerking:</label>
      <input type="text" id="note" placeholder="Bijv. Bij ontbijt">
    </div>

    <button type="submit" class="btn-submit" id="submit-btn">Opslaan</button>
  </form>

  <div class="history">
    <h3>Vandaag gedronken:</h3>
    <ul id="history-list"></ul>
  </div>
</div>

<script>
  // VUL HIER JOUW APPS SCRIPT WEBAPP URL IN
  const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbz31A9nrHS5C8Vc0A5A_XOEbMO15xVOBpcwUZhLfFQfxiNjSyIhlrvQA2_JSKUMBnNYag/exec"; 
  let MAX_LIMIT = 1000;

  window.onload = function() {
    loadDataAndSettings();
  };

  function loadDataAndSettings() {
    if (SCRIPT_URL === "JOUW_GOOGLE_APPS_SCRIPT_WEBAPP_URL_HIER") return;

    fetch(SCRIPT_URL)
      .then(res => res.json())
      .then(data => {
        if (data.status === "success") {
          document.getElementById('user-info').textContent = "Ingelogd als: " + (data.email || data.user);
          MAX_LIMIT = data.settings.dailyLimit || 1000;
          document.getElementById('limit-amount').textContent = MAX_LIMIT;

          // Vul snelkeuze knoppen in
          const btnContainer = document.getElementById('quick-buttons-container');
          btnContainer.innerHTML = '';
          data.settings.quickAmounts.forEach(amt => {
            const btn = document.createElement('button');
            btn.type = 'button';
            btn.textContent = amt + ' ml';
            btn.onclick = () => document.getElementById('amount').value = amt;
            btnContainer.appendChild(btn);
          });

          // Vul dropdown opties in
          const selectType = document.getElementById('type');
          selectType.innerHTML = '';
          data.settings.drinkTypes.forEach(type => {
            const opt = document.createElement('option');
            opt.value = type;
            opt.textContent = type;
            selectType.appendChild(opt);
          });

          // Update de voortgang en lijst
          updateUI(data.totalMl, data.history);
        }
      })
      .catch(err => console.error("Fout bij ophalen:", err));
  }

  document.getElementById('drink-form').addEventListener('submit', function(e) {
    e.preventDefault();
    const btn = document.getElementById('submit-btn');
    btn.disabled = true;
    btn.textContent = "Bezig met opslaan...";

    const amount = parseInt(document.getElementById('amount').value);
    const type = document.getElementById('type').value;
    const note = document.getElementById('note').value;

    const payload = {
      category: "Drink",
      hoeveelheidMl: amount,
      typeDrank: type,
      opmerking: note
    };

    fetch(SCRIPT_URL, {
      method: "POST",
      headers: { "Content-Type": "text/plain;charset=utf-8" },
      body: JSON.stringify(payload)
    })
    .then(res => res.json())
    .then(() => {
      document.getElementById('amount').value = '';
      document.getElementById('note').value = '';
      btn.disabled = false;
      btn.textContent = "Opslaan";
      loadDataAndSettings(); // Direct verversen
    })
    .catch(() => {
      btn.disabled = false;
      btn.textContent = "Opslaan";
      loadDataAndSettings();
    });
  });

  function updateUI(totalMl, history) {
    document.getElementById('total-amount').textContent = totalMl;
    let percentage = (totalMl / MAX_LIMIT) * 100;
    if (percentage > 100) percentage = 100;

    const bar = document.getElementById('progress-bar');
    bar.style.width = percentage + '%';

    if (totalMl >= MAX_LIMIT) bar.style.backgroundColor = '#f44336';
    else if (totalMl >= (MAX_LIMIT * 0.8)) bar.style.backgroundColor = '#ff9800';
    else bar.style.backgroundColor = '#4caf50';

    const list = document.getElementById('history-list');
    list.innerHTML = '';
    history.forEach(item => {
      const li = document.createElement('li');
      li.innerHTML = `<span><strong>${item.time}</strong> - ${item.type} (${item.note || '-'})</span> <span><strong>${item.amount} ml</strong></span>`;
      list.appendChild(li);
    });
  }
</script>

</body>
</html>
